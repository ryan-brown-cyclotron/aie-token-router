name: Build Backend Image

# Builds the UsageTracker.Functions backend container (src/UsageTracker.Functions/Dockerfile)
# and pushes it to GitHub Container Registry. Manual dispatch only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag to apply (e.g. v1.2.3). 'latest' and the short commit SHA are always applied."
        required: false
        default: ""
      push:
        description: "Push to GHCR (untick to build-only and validate the Dockerfile)."
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Namespaced under the repo, e.g. ghcr.io/<owner>/token-optimization/usage-tracker-backend.
  IMAGE_NAME: ${{ github.repository }}/usage-tracker-backend
  DOCKERFILE: src/UsageTracker.Functions/Dockerfile

jobs:
  build:
    name: Build & push backend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only need registry credentials when we actually push. GITHUB_TOKEN with packages:write
      # authenticates to GHCR with no extra secrets to configure.
      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      # Build context is the repo root so the Dockerfile can reach the referenced
      # UsageTracker.Library and UsageTracker.ServiceDefaults projects.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Backend image"
            echo ""
            echo "**Pushed:** ${{ inputs.push }}"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
